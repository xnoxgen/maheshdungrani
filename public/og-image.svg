<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF720C" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#100D0B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#A83F0B" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#100D0B" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FF720C" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#100D0B" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer frame border -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />
  
  <!-- Corner accents -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#FF720C" stroke-width="2.5" />
  <path d="M 1130 40 L 1160 40 L 1160 70" fill="none" stroke="#FF720C" stroke-width="2.5" />
  <path d="M 40 560 L 40 590 L 70 590" fill="none" stroke="#FF720C" stroke-width="2.5" />
  <path d="M 1130 590 L 1160 590 L 1160 560" fill="none" stroke="#FF720C" stroke-width="2.5" />

  <!-- Monogram emblem -->
  <rect x="80" y="80" width="64" height="64" rx="12" fill="#19130F" stroke="#FF720C" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="112" y="122" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#FF720C" text-anchor="middle">MD</text>

  <!-- Badge label -->
  <text x="160" y="117" font-family="'Courier New', monospace" font-size="13" font-weight="600" fill="#FF720C" letter-spacing="3">C&amp;I LEAD ENGINEERING PROFESSIONAL</text>

  <!-- Main Headline -->
  <text x="80" y="240" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#F5F0E9">Mahesh Dungrani</text>
  
  <!-- Subtitle -->
  <text x="80" y="300" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#FF720C">Control &amp; Instrumentation Lead Design &amp; Engineering</text>
  <text x="80" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#A9A19A">Thermal &amp; Nuclear Power Infrastructure • 24+ Years of Industry Experience</text>

  <!-- Highlights bar -->
  <g transform="translate(80, 420)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="220" height="90" rx="10" fill="#19130F" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="24" y="44" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#F5F0E9">24+ Years</text>
    <text x="24" y="70" font-family="'Courier New', monospace" font-size="11" fill="#77716B" letter-spacing="1">EXPERIENCE</text>

    <!-- Stat 2 -->
    <rect x="240" y="0" width="220" height="90" rx="10" fill="#19130F" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="264" y="44" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#FF720C">16 Years</text>
    <text x="264" y="70" font-family="'Courier New', monospace" font-size="11" fill="#77716B" letter-spacing="1">NPCIL (PHWR)</text>

    <!-- Stat 3 -->
    <rect x="480" y="0" width="220" height="90" rx="10" fill="#19130F" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="504" y="44" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#F5F0E9">9 Years</text>
    <text x="504" y="70" font-family="'Courier New', monospace" font-size="11" fill="#77716B" letter-spacing="1">GIPCL (THERMAL)</text>

    <!-- Stat 4 -->
    <rect x="720" y="0" width="280" height="90" rx="10" fill="#19130F" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="744" y="44" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#F5F0E9">Mumbai, IN</text>
    <text x="744" y="70" font-family="'Courier New', monospace" font-size="11" fill="#77716B" letter-spacing="1">LOCATION</text>
  </g>

  <!-- URL watermark -->
  <text x="1120" y="550" font-family="'Courier New', monospace" font-size="12" fill="#77716B" text-anchor="end" letter-spacing="2">linkedin.com/in/mahesh-dungrani</text>
</svg>
